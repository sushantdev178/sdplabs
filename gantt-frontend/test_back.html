<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DHTMLX Gantt - Physics Engine (Local Storage Edition)</title>
    <script src="codebase/dhtmlxgantt.js"></script>
    <link rel="stylesheet" href="codebase/dhtmlxgantt.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: row;
        }

        /* SIDEBAR CONFIGURATION PANEL */
        #config_panel {
            width: 320px;
            background: #f4f5f9;
            border-right: 1px solid #cecece;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #config_panel h3 {
            margin-top: 0;
            font-size: 16px;
            color: #333;
            border-bottom: 2px solid #0288d1;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .form-group textarea {
            height: 160px;
            font-family: monospace;
            resize: vertical;
        }

        /* GANTT & LOG AREA */
        #main_content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #controls {
            padding: 10px 15px;
            background: #fff;
            border-bottom: 1px solid #cecece;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background: #e1f5fe;
            color: #0277bd;
            border: 1px solid #81d4fa;
            text-transform: uppercase;
        }

        .btn-action {
            padding: 8px 16px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn-blue {
            background: #0288d1;
        }

        .btn-blue:hover {
            background: #0277bd;
        }

        .btn-red {
            background: #d32f2f;
        }

        .btn-red:hover {
            background: #b71c1c;
        }

        .btn-gray {
            background: #546e7a;
        }

        .btn-gray:hover {
            background: #37474f;
        }

        .btn-inline {
            width: auto;
            margin-bottom: 0;
        }

        #gantt_here {
            flex: 1 1 auto;
            width: 100%;
        }

        /* DIAGNOSTIC LOG WINDOW */
        #log_container {
            height: 220px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-top: 3px solid #0288d1;
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        #log_header {
            padding: 5px 15px;
            background: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            font-weight: bold;
        }

        #log_window {
            flex-grow: 1;
            padding: 10px 15px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .log-time {
            color: #569cd6;
            margin-right: 10px;
        }

        .log-action {
            color: #ce9178;
            font-weight: bold;
            margin-right: 5px;
        }

        .weekend_holiday_cell {
            background-color: rgba(0, 0, 0, 0.05) !important;
        }

        .constraint-asap {
            color: #888;
            font-style: italic;
        }

        .constraint-snet {
            color: #e53935;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="config_panel">
        <h3>Configuration Sandbox</h3>

        <div class="form-group">
            <label>Gap Behavior:</label>
            <select id="cfg_gap">
                <option value="compress">Compress</option>
                <option value="keep">Keep</option>
            </select>
        </div>

        <div class="form-group">
            <label>Work Days (0=Sun, 6=Sat):</label>
            <input type="text" id="cfg_workdays" value="1,2,3,4,5">
        </div>

        <div class="form-group">
            <label>Holidays (YYYY-MM-DD):</label>
            <textarea id="cfg_holidays"></textarea>
        </div>

        <div class="form-group">
            <label>Tasks & Links (JSON Object):</label>
            <textarea id="cfg_tasks"></textarea>
        </div>

        <button class="btn-action btn-blue" onclick="saveAndApply()">Apply & Save Data</button>
        <button class="btn-action btn-red" onclick="resetToFactoryJSON()">Reset to Default JSON</button>
    </div>

    <div id="main_content">
        <div id="controls">
            <strong>Physics Engine Status:</strong>
            <span id="gap_display" class="badge">Gap: LOADING...</span>
            <button class="btn-action btn-red btn-inline" onclick="resetToASAP()">Reset All to ASAP (Watch
                Gravity)</button>
        </div>

        <div id="gantt_here"></div>

        <div id="log_container">
            <div id="log_header">
                <span>⚙️ Diagnostic Event Log</span>
                <button class="btn-action btn-gray btn-inline" style="padding: 3px 10px; font-size: 12px;"
                    onclick="clearLog()">Clear Log</button>
            </div>
            <div id="log_window"></div>
        </div>
    </div>

    <script>
        // --- LOGGER FUNCTIONALITY ---
        function writeLog(action, details) {
            const win = document.getElementById("log_window");
            const time = new Date().toISOString().split('T')[1].slice(0, -1);
            const entry = document.createElement("div");
            entry.className = "log-entry";
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-action">[${action}]</span> <span>${details}</span>`;
            win.appendChild(entry);
            win.scrollTop = win.scrollHeight;
        }
        function clearLog() { document.getElementById("log_window").innerHTML = ""; }

        // --- FACTORY DEFAULT JSON ---
        const DEFAULT_JSON = {
            "gap_behavior": "compress",
            "work_days": [1, 2, 3, 4, 5],
            "holidays": ["2026-06-04", "2026-06-12", "2026-06-15", "2026-06-26"],
            "data": [
                { "id": "root", "text": "Master Implementation Plan", "type": "project", "open": true },
                { "id": 10, "parent": "root", "text": "Database Migration", "start_date": "2026-06-01", "duration": 7, "open": true, "constraint_type": "snet", "constraint_date": "2026-06-01" },
                { "id": 11, "parent": 10, "text": "Schema Design Review", "start_date": "2026-06-01", "duration": 4, "open": true },
                { "id": 12, "parent": 11, "text": "Data Profiling", "start_date": "2026-06-01", "duration": 2 },
                { "id": 13, "parent": 11, "text": "Mapping Rules Validation", "start_date": "2026-06-03", "duration": 2 },
                { "id": 14, "parent": 10, "text": "Test Data Extraction", "start_date": "2026-06-08", "duration": 2 },
                { "id": 20, "parent": "root", "text": "API Integration", "start_date": "2026-06-25", "duration": 6, "open": true, "constraint_type": "snet", "constraint_date": "2026-06-25" },
                { "id": 21, "parent": 20, "text": "Core Endpoints Setup", "start_date": "2026-06-25", "duration": 4, "open": true },
                { "id": 22, "parent": 21, "text": "Authentication Flow", "start_date": "2026-06-25", "duration": 1 },
                { "id": 23, "parent": 21, "text": "Payload Parsing", "start_date": "2026-06-26", "duration": 2 },
                { "id": 24, "parent": 20, "text": "Unit Testing", "start_date": "2026-07-01", "duration": 2 },
                { "id": 30, "parent": "root", "text": "Frontend Overhaul", "start_date": "2026-07-09", "duration": 5, "open": true, "constraint_type": "snet", "constraint_date": "2026-07-09" },
                { "id": 31, "parent": 30, "text": "Component Library Update", "start_date": "2026-07-09", "duration": 3, "open": true },
                { "id": 32, "parent": 31, "text": "Dashboard Layout", "start_date": "2026-07-09", "duration": 1 },
                { "id": 33, "parent": 31, "text": "Widget Integration", "start_date": "2026-07-10", "duration": 1 }
            ],
            "links": [
                { "id": 1, "source": 10, "target": 20, "type": "0" },
                { "id": 2, "source": 20, "target": 30, "type": "0" },
                { "id": 3, "source": 11, "target": 14, "type": "0" },
                { "id": 4, "source": 21, "target": 24, "type": "0" }
            ]
        };

        // --- GANTT CONFIGURATION ---
        gantt.plugins({ auto_scheduling: true, worktime: true });

        gantt.config.auto_scheduling = false;
        gantt.config.auto_scheduling_strict = true;
        gantt.config.open_tree_initially = true;
        gantt.config.work_time = true;
        gantt.config.correct_work_time = true;
        gantt.config.duration_unit = "day";
        gantt.config.auto_types = false;
        gantt.config.date_grid = "%d %M %Y";
        gantt.config.drag_project = false;

        gantt.templates.timeline_cell_class = function (task, date) {
            return gantt.isWorkTime({ date: date, task: task }) ? "" : "weekend_holiday_cell";
        };

        gantt.config.columns = [
            { name: "text", label: "Task name", tree: true, width: 220 },
            {
                name: "constraint_type", label: "Constraint", align: "center", width: 80, template: function (task) {
                    if (task.type === "project") return "-";
                    let type = task.constraint_type || "asap";
                    return `<span class="constraint-${type}">${type.toUpperCase()}</span>`;
                }
            },
            {
                name: "constraint_date", label: "C. Date", align: "center", width: 100, template: function (task) {
                    if (task.type === "project") return "-";
                    return task.constraint_date ? gantt.templates.date_grid(task.constraint_date, task) : "";
                }
            }
        ];

        let autoScheduleOriginalDates = {};
        let dragCache = {};
        let initialParentStart = null;
        let isShiftingDescendants = false;
        let currentGapBehavior = "keep";

        // --- DRAG PHYSICS ---
        gantt.attachEvent("onBeforeTaskDrag", function (id, mode, e) {
            if (mode === gantt.config.drag_mode.move) {
                const task = gantt.getTask(id); // BUG FIX: Get task properly
                writeLog("USER DRAG", `Started moving [${task.text}]`);
                dragCache = {};
                initialParentStart = task.start_date.valueOf(); // BUG FIX: No longer NaN

                gantt.eachTask(function (child) {
                    dragCache[child.id] = {
                        start_date: child.start_date.valueOf(),
                        duration: child.duration
                    };
                }, id);
            }
            return true;
        });

        gantt.attachEvent("onTaskDrag", function (id, mode, task, original) {
            if (mode === gantt.config.drag_mode.move) {
                const timeDiff = task.start_date.valueOf() - initialParentStart;

                gantt.eachTask(function (child) {
                    if (dragCache[child.id]) {
                        child.start_date = new Date(dragCache[child.id].start_date + timeDiff);
                        child.end_date = gantt.calculateEndDate({ start_date: child.start_date, duration: dragCache[child.id].duration });
                        gantt.refreshTask(child.id);
                    }
                }, id);
            }
            return true;
        });

        gantt.attachEvent("onAfterTaskDrag", function (id, mode, e) {
            if (mode === gantt.config.drag_mode.move) {
                const task = gantt.getTask(id); // BUG FIX: Get task properly
                writeLog("USER DROP", `Dropped [${task.text}]. Anchoring and pushing links.`);

                isShiftingDescendants = true;

                gantt.batchUpdate(function () {
                    task.start_date = gantt.getClosestWorkTime({ date: task.start_date, dir: "future" });
                    task.end_date = gantt.calculateEndDate({ start_date: task.start_date, duration: task.duration });
                    if (task.type !== "project") {
                        task.constraint_type = "snet";
                        task.constraint_date = new Date(task.start_date);
                    }
                    gantt.updateTask(task.id);

                    const snappedDiff = task.start_date.valueOf() - initialParentStart;
                    gantt.eachTask(function (child) {
                        if (dragCache[child.id]) {
                            const rawStart = new Date(dragCache[child.id].start_date + snappedDiff);
                            child.start_date = gantt.getClosestWorkTime({ date: rawStart, dir: snappedDiff > 0 ? "future" : "past" });
                            child.end_date = gantt.calculateEndDate({ start_date: child.start_date, duration: dragCache[child.id].duration });
                            if (child.type !== "project") {
                                child.constraint_type = "snet";
                                child.constraint_date = new Date(child.start_date);
                            }
                            gantt.updateTask(child.id);
                        }
                    }, id);
                });

                isShiftingDescendants = false;
                dragCache = {};
                initialParentStart = null;

                if (gantt.config.auto_scheduling) gantt.autoSchedule();
            }
        });

        // --- GANTT EVENTS & SHIELDS ---
        gantt.attachEvent("onTaskLoading", function (task) {
            if (task.type !== "project" && !task.constraint_type) task.constraint_type = "asap";
            if (task.constraint_type === "snet" && typeof task.constraint_date === "string") {
                const p = task.constraint_date.split("-");
                task.constraint_date = new Date(p[0], p[1] - 1, p[2]);
            }
            return true;
        });

        gantt.attachEvent("onBeforeLinkAdd", function (id, link) {
            link.original_lag = 0;
            link.lag = currentGapBehavior === 'compress' ? 0 : link.original_lag;
            return true;
        });

        gantt.attachEvent("onBeforeTaskAutoSchedule", function (task, start, link, predecessor) {
            if (task.type === "project") return false;

            // BUG FIX: Ensure "root" string IDs are treated as top level
            let isTopLevel = (task.parent == 0 || task.parent === "root" || task.parent === gantt.config.root_id);

            if (!isTopLevel) {
                const pTask = gantt.isTaskExists(task.parent) ? gantt.getTask(task.parent) : null;
                if (pTask && pTask.type === "project") isTopLevel = true;
            }

            // SHIELD: If a leaf task has NO incoming links pulling it, block auto-schedule from snapping it to project floor.
            if (!isTopLevel && !predecessor) {
                return false;
            }
            return true;
        });

        gantt.attachEvent("onBeforeAutoSchedule", function () {
            autoScheduleOriginalDates = {};
            gantt.eachTask(t => { autoScheduleOriginalDates[t.id] = new Date(t.start_date); });
            return true;
        });

        gantt.attachEvent("onAfterTaskAutoSchedule", function (task, start, link, predecessor) {
            if (isShiftingDescendants) return;
            const originalStart = autoScheduleOriginalDates[task.id];
            if (originalStart) {
                const timeDiff = task.start_date.getTime() - originalStart.getTime();
                if (timeDiff !== 0) {
                    isShiftingDescendants = true;
                    gantt.batchUpdate(function () {
                        gantt.eachTask(function (child) {
                            let rawNewStart = new Date(child.start_date.getTime() + timeDiff);
                            child.start_date = gantt.getClosestWorkTime({ date: rawNewStart, dir: timeDiff > 0 ? "future" : "past" });
                            child.end_date = gantt.calculateEndDate({ start_date: child.start_date, duration: child.duration });
                            gantt.updateTask(child.id);
                        }, task.id);
                    });
                    isShiftingDescendants = false;
                }
            }
        });

        // --- LOCAL STORAGE & DATA MANAGEMENT ---
        function initApp() {
            gantt.init("gantt_here");
            loadGanttData();
        }

        function resetToFactoryJSON() {
            localStorage.removeItem("gantt_config");
            writeLog("SYSTEM", "Factory JSON Restored.");
            loadGanttData();
        }

        function saveAndApply() {
            try {
                const tasksJson = JSON.parse(document.getElementById("cfg_tasks").value);
                const workDays = document.getElementById("cfg_workdays").value.split(",").map(Number).filter(n => !isNaN(n));
                const holidays = document.getElementById("cfg_holidays").value.split(",").map(s => s.trim()).filter(s => s);

                const config = {
                    gap_behavior: document.getElementById("cfg_gap").value,
                    work_days: workDays,
                    holidays: holidays,
                    data: tasksJson.data || tasksJson,
                    links: tasksJson.links || []
                };

                localStorage.setItem("gantt_config", JSON.stringify(config));
                writeLog("SYSTEM", "Settings Applied & Saved.");
                loadGanttData();
            } catch (e) {
                alert("Invalid JSON format in Tasks & Links field:\n\n" + e.message);
                writeLog("ERROR", "Failed to parse JSON input.");
            }
        }

        function loadGanttData() {
            gantt.clearAll();

            let savedConfig = localStorage.getItem("gantt_config");
            let data = savedConfig ? JSON.parse(savedConfig) : JSON.parse(JSON.stringify(DEFAULT_JSON));

            document.getElementById("cfg_gap").value = data.gap_behavior || "keep";
            document.getElementById("cfg_workdays").value = (data.work_days || []).join(",");
            document.getElementById("cfg_holidays").value = (data.holidays || []).join(", ");
            document.getElementById("cfg_tasks").value = JSON.stringify({ data: data.data, links: data.links }, null, 2);

            currentGapBehavior = data.gap_behavior || "keep";
            document.getElementById("gap_display").textContent = "Gap: " + currentGapBehavior;

            for (let d = 0; d <= 6; d++) {
                gantt.setWorkTime({ day: d, hours: (data.work_days && data.work_days.includes(d)) ? ["08:00-17:00"] : false });
            }
            if (data.holidays) {
                data.holidays.forEach(dateStr => {
                    const parts = dateStr.split("-");
                    if (parts.length === 3) gantt.setWorkTime({ date: new Date(parts[0], parts[1] - 1, parts[2]), hours: false });
                });
            }

            let projStart = null;
            data.data.forEach(t => {
                if (t.start_date) {
                    const parts = t.start_date.split("-");
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    if (!projStart || d < projStart) projStart = d;
                }
            });
            if (projStart) gantt.config.project_start = projStart;

            gantt.parse({ data: data.data, links: data.links });

            gantt.batchUpdate(() => {
                gantt.getLinks().forEach(link => {
                    const source = gantt.getTask(link.source);
                    const target = gantt.getTask(link.target);
                    if (source && target && source.end_date && target.start_date) {
                        link.original_lag = gantt.calculateDuration({ start_date: source.end_date, end_date: target.start_date });
                        link.lag = currentGapBehavior === "compress" ? 0 : link.original_lag;

                        if (currentGapBehavior === "compress" && target.type !== "project") {
                            target.constraint_type = "asap";
                            target.constraint_date = null;
                            gantt.updateTask(target.id);
                        }
                        gantt.updateLink(link.id);
                    }
                });
            });

            gantt.config.auto_scheduling = true;
            if (currentGapBehavior === "compress") {
                writeLog("ENGINE", "Compress mode detected. Applying auto-schedule collapse.");
                gantt.autoSchedule();
            }
            writeLog("SYSTEM", "Ready.");
        }

        function resetToASAP() {
            writeLog("UI ACTION", "Resetting all constraints to ASAP.");
            gantt.batchUpdate(() => {
                gantt.eachTask(task => {
                    if (task.type !== "project") {
                        task.constraint_type = "asap";
                        task.constraint_date = null;
                        gantt.updateTask(task.id);
                    }
                });
                gantt.autoSchedule();
            });
        }

        window.onload = initApp;

    </script>
</body>

</html>
